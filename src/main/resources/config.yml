# ==============================================================================
# MythicWardrobe — Основная конфигурация (Paper 1.21.8 - 1.21.11)
# ==============================================================================

# Настройки MineSkin API v2 (https://account.mineskin.org/keys)
# ВАЖНО: без API-ключа MineSkin искусственно замедляет каждый запрос на 6 секунд!
# Бесплатный ключ на account.mineskin.org/keys ускоряет загрузку в 3-5 раз!
# Либо укажите в base-url свой собственный Skin-Signer API (tools/selfhosted_skin_signer.py).
mineskin:
  api-key: "YOUR_MINESKIN_API_KEY"
  # Базовый URL API (по умолчанию официальный MineSkin v2 /v2/generate; можно указать свой локальный сервер http://127.0.0.1:8088)
  base-url: "https://api.mineskin.org"
  # Имя User-Agent для запросов в MineSkin
  user-agent: "MythicWardrobe/1.5"
  # Видимость загружаемых текстур: "unlisted" (рекомендуется) или "public"
  visibility: "unlisted"
  # Сколько скинов можно одновременно отправлять/опрашивать в MineSkin v2 (рекомендуется 3-5)
  max-concurrency: 4
  # Таймаут ожидания генерации одной текстуры в секундах
  timeout-seconds: 45
  # Максимальный интервал опроса очереди MineSkin /v2/queue/{id} в мс (если сервер поставил задачу в очередь)
  poll-interval-ms: 700
  # Задержка объединения изменений перед отправкой в MineSkin (в тиках, 8 тиков = 0.4 сек)
  rebuild-debounce-ticks: 8

# Настройки скинов и SkinsRestorer
skin:
  # Режим применения скина:
  # AUTO — использовать SkinsRestorer v15, если установлен, иначе Paper API
  # SKINSRESTORER — только SkinsRestorer v15
  # PAPER — напрямую через Paper PlayerProfile
  backend: "AUTO"
  # Если true, при старте с пустой папкой overlays/ создадутся 2 тестовых PNG-слоя
  create-example-overlays: true
  # Модель по умолчанию, если не удалось определить Classic/Slim у игрока (CLASSIC или SLIM)
  default-variant: "CLASSIC"
  # Если у игрока на offline-сервере вообще нет базового скина, использовать файл из plugins/MythicWardrobe/base_skins/
  fallback-base-skin:
    classic: "default_classic.png"
    slim: "default_slim.png"
  # Очищать ли ВЕСЬ второй слой (outer layer) базового скина при наличии одежды,
  # или только зоны, указанные в slots.yml у надетых слоёв (рекомендуется false — точечная очистка)
  clear-all-outer-layer: false
  # Автоматически пересобирать одежду поверх нового скина, если игрок прописал /skin <ник>
  reapply-on-base-skin-change: true
  # НЕ закрывать открытый инвентарь / GUI (гардероб, DeluxeMenus, сундуки) при смене скина!
  # Пока у игрока открыто меню, новый скин собирается и подписывается в фоне, а применяется
  # мгновенно (0 мс) в момент, когда игрок сам закроет меню.
  defer-apply-while-gui-open: true
  # Если defer-apply-while-gui-open: false и открыт гардероб — переоткрывать ту же вкладку после смены скина.
  auto-reopen-gui-after-skin-apply: true

# Поведение клика по ванильным слотам брони в инвентаре игрока
inventory-trigger:
  # Открывать ли меню раздела (Шлем/Нагрудник/Поножи/Ботинки) при клике на слот брони в инвентаре
  enabled: true
  # Режим открытия:
  # EMPTY_OR_RIGHT — открывать при пустом курсоре (ЛКМ/ПКМ) или при ПКМ с любым предметом
  # ALWAYS — всегда открывать при клике (предмет на курсоре вернётся в инвентарь)
  # RIGHT_CLICK_ONLY — только по ПКМ на слот брони
  click-mode: "EMPTY_OR_RIGHT"
  # Если игрок кликает по слоту брони, держа на курсоре подходящую одежду (например, куртку по нагруднику),
  # сразу надевать её в нужный слот гардероба без открытия меню
  smart-cursor-equip: true
  # Разрешить надевать одежду (2D-скин / 3D-аксессуар) по ПКМ в воздухе из хотбара
  right-click-quick-equip: true

# Блокировка конфликтующих слоёв/слотов (например, костюм химзащиты в слое jacket
# блокирует pants, undershirt, belt_skin, gloves, socks, boots_skin и т.д.)
blocking:
  # Режим по умолчанию, если на предмете не указан свой block-mode:
  #   UNEQUIP — автоматически снять мешающие вещи и вернуть игроку в инвентарь (рекомендуется!)
  #   PREVENT — не давать надеть костюм, пока игрок сам не снимет мешающие вещи
  #   HIDE    — оставить вещи в их слотах, но заблокировать слоты и полностью скрыть их визуально до снятия костюма
  default-mode: "UNEQUIP"
  # Материал иконки заблокированного слота в меню гардероба
  locked-slot-material: "BARRIER"
  # Автоматически очищать 2-й слой (outer layer) базового скина у заблокированных 2D-слоёв
  # (чтобы ванильные штаны/шапка базового скина не торчали поверх цельного костюма химзащиты!)
  inherit-clear-outer-regions: true

# Косметическая броня (совместимо с MythicArmors и ванильной бронёй)
cosmetic-armor:
  # Включить систему косметической брони и комбо-моделей
  enabled: true
  # Показывать косметическую броню самому игроку в 3-м лице (F5) через подмену пакетов SET_SLOT/WINDOW_ITEMS.
  # Автоматически отключается в режиме Creative во избежание перезаписи предметов!
  # Требует установленный плагин PacketEvents для полной работы.
  show-to-self: true

# 3D-аксессуары и многослойная 3D-броня MythicArmors (Маска поверх шлема, Рюкзак поверх бронежилета и т.д.)
display-3d:
  enabled: true
  # Как часто обновлять позицию и поворот 3D-модели (в тиках; 1 = максимально плавно, 2 = экономичнее)
  update-interval-ticks: 1
  # Длительность клиентской интерполяции телепортации (в тиках)
  teleport-duration: 2
  # Скрывать ли доп. 3D-слой MythicArmors (ArmorStand) от самого владельца (false = видно в F5)
  hide-armor-overlay-from-wearer: false

# Поведение при смерти игрока
death:
  # Сохранять ли вещи из доп. слотов гардероба (футболка, куртка, косметика, рюкзак, маски и т.д.) при смерти.
  # Реальная броня в ванильных слотах подчиняется обычному правилу keepInventory сервера.
  keep-wardrobe-items-on-death: true

# Временный встроенный веб-редактор скинов и слоёв для тестирования (/wardrobe web)
# Изолированный модуль (пакет dev.mythicwardrobe.web): когда сделаете внутриигровое меню,
# просто поставьте enabled: false (или удалите пакет web).
web-editor:
  enabled: true
  # IP интерфейса, на котором слушать встроенный HTTP-сервер (0.0.0.0 — все интерфейсы)
  host: "0.0.0.0"
  # Порт HTTP-сервера (откройте в фаерволе, если заходите не с localhost)
  port: 8095
  # Публичный URL, который выдаётся игрокам в чате по /wardrobe web (без слеша в конце)
  public-url: "http://localhost:8095"
  # Время жизни одноразовой ссылки игрока в минутах
  token-expire-minutes: 30

# Отладочные логи в консоль (удобно на этапе настройки MineSkin и MythicMobs)
debug: false
