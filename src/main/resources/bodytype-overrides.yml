# ==============================================================================
# MythicWardrobe — Авто-подбор 3D-модели брони под тип тела (3px Slim / 4px Wide)
# ==============================================================================
# Позволяет сделать ОДИН предмет брони (например, бронежилет с щитками на руках),
# который автоматически подставляет нужную 3D-модель из MythicArmors в зависимости
# от выбранного игроком типа тела:
#   - slim (3px узкие руки)
#   - wide (4px широкие руки)
#
# Если броня универсальная (например, только жилет без рукавов или полностью закрытая),
# добавлять её сюда не нужно — она будет одинаково отображаться на обоих типах тела.
#
# Формат правила:
#   rules:
#     tactical_vest_arms:
#       source: "TacticalVest"                              # MythicMobs ID или ключ модели (mythicarmor:...)
#       slim: "mythicarmor:tactical_vest_slim_chest_piece"  # Модель (namespace:key) или MythicMobs ID для 3px
#       wide: "mythicarmor:tactical_vest_wide_chest_piece"  # Модель (namespace:key) или MythicMobs ID для 4px

rules: {}
