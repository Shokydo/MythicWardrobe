# ==============================================================================
# MythicWardrobe v1.11.0 — Настройка режимов и визуального оформления всех меню
# ==============================================================================
# Все 21 слот полностью разделены и разложены без наложений во всех 3 режимах:
#   HEAD  (6): hat, mask_skin, hair_3d, mask_3d, helmet_real, helmet_cosmetic
#   CHEST (6): undershirt, jacket, gloves, chest_real, chest_cosmetic, backpack_3d
#   LEGS  (5): pants, belt_skin, legs_real, legs_cosmetic, belt_3d
#   FEET  (4): socks, boots_skin, boots_real, boots_cosmetic
#
# Доступные режимы (default-mode):
#   COMPACT — отдельные 1-строчные меню (9 слотов) для каждого раздела брони + хаб
#   TABBED  — одно меню с 4 вкладками (поддерживает и общие slot-positions, и раздельные sections.{HEAD,CHEST,LEGS,FEET})
#   UNIFIED — одно большое меню со ВСЕМИ 21 слотами сразу (5 строк = 45 слотов)
# ==============================================================================

default-mode: "COMPACT"
allow-player-switch: true
back-command: ""
back-fallback: "INVENTORY"
inventory-title: "<#1e293b>Инвентарь и Экипировка"

# ==============================================================================
# РЕЖИМ 1: COMPACT — Отдельные 1-строчные меню для каждого раздела брони
# ==============================================================================
compact_hub:
  title: "<#38bdf8>Гардероб <dark_gray>▪ <gray>Выберите раздел"
  rows: 1
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  buttons:
    back:
      slots: [0]
      action: BACK
      material: ARROW
      name: "<#fbbf24>◀ Назад"
      lore:
        - "<gray>Вернуться назад / открыть инвентарь"
    head:
      slots: [1]
      action: OPEN_HEAD
      material: IRON_HELMET
      name: "<#f8fafc>Шлем и Голова"
      lore:
        - "<gray>6 слотов: Шапка 2D • Маска 2D • Причёска 3D"
        - "<dark_gray>Маска 3D • Шлем (Броня) • Шлем (Косметика)"
    chest:
      slots: [2]
      action: OPEN_CHEST
      material: IRON_CHESTPLATE
      name: "<#f8fafc>Нагрудник и Торс"
      lore:
        - "<gray>6 слотов: Футболка • Куртка • Перчатки"
        - "<dark_gray>Нагрудник (Броня) • Косметика • Рюкзак 3D"
    legs:
      slots: [3]
      action: OPEN_LEGS
      material: IRON_LEGGINGS
      name: "<#f8fafc>Поножи, Штаны и Пояс"
      lore:
        - "<gray>5 слотов: Штаны 2D • Пояс 2D"
        - "<dark_gray>Поножи (Броня) • Косметика • Пояс 3D"
    feet:
      slots: [4]
      action: OPEN_FEET
      material: IRON_BOOTS
      name: "<#f8fafc>Ботинки и Обувь"
      lore:
        - "<gray>4 слота: Носки 2D • Ботинки 2D"
        - "<dark_gray>Ботинки (Броня) • Ботинки (Косметика)"
    refresh:
      slots: [6]
      action: REFRESH_SKIN
      material: LIME_DYE
      name: "<#4ade80>Обновить скин"
      lore:
        - "<gray>Пересобрать 2D-слои и 3D-броню"
    reset:
      slots: [7]
      action: RESET_SKIN
      material: RED_DYE
      name: "<#f87171>Сбросить слои скина"
      lore:
        - "<gray>Очистить слои от команд/скиллов"
    switch_mode:
      slots: [8]
      action: CYCLE_MODE
      material: COMPARATOR
      name: "<#facc15>Вид меню: <white><mode>"
      lore:
        - "<gray>Нажмите, чтобы переключить:"
        - "<dark_gray>Компактное (1 строчка) → С вкладками → Большое"

