# ==============================================================================
# MythicWardrobe — Настройка режимов и визуального оформления всех меню (GUI)
# ==============================================================================
# Доступные режимы меню (default-mode):
#   COMPACT — отдельные компактные менюшки в 1 строчку (9 слотов) для каждого слота:
#             Шлем / Нагрудник / Поножи / Ботинки (+ компактный хаб по /wardrobe)
#   TABBED  — одно меню с вкладками переключения между Шлемом/Нагрудником/Поножами/Ботинками
#   UNIFIED — одно большое меню со ВСЕМИ 4 разделами сразу в одном окне
#
# Вы можете менять у КАЖДОГО меню:
#   • title            — название (MiniMessage, hex <#38bdf8>, &-коды, шрифты ресурспака!)
#   • rows             — размер меню в строчках (от 1 до 6; 1 строчка = 9 слотов, 6 = 54 слота)
#   • filler           — фоновая рамка (material, custom-model-data, item-model, hide-tooltip)
#   • slot-positions   — точные номера слотов (0..size-1) для каждого слота одежды/брони
#   • buttons          — любые кнопки и декоративные элементы!
#
# Доступные действия кнопок (action):
#   OPEN_HEAD, OPEN_CHEST, OPEN_LEGS, OPEN_FEET, OPEN_HUB, OPEN_UNIFIED,
#   BACK (кнопка «◀ Назад» — возвращает на предыдущий экран или запускает back-command),
#   RUN_COMMAND (выполнить команду из поля `command:` у кнопки, поддерживается `console:...`),
#   CYCLE_MODE (переключить режим меню), REFRESH_SKIN, RESET_SKIN,
#   OPEN_WEB (выдать ссылку на веб-редактор), CLOSE, NONE (просто декор)
#
# Поддержка ресурспаков (Nexo / ItemsAdder / Crucible / ванильный 1.21+):
#   У любой кнопки/фона можно указать:
#     custom-model-data: 1001
#     item-model: "mypack:ui_button_helmet"
#     hide-tooltip: true
# ==============================================================================

default-mode: "COMPACT"
allow-player-switch: true
# Команда для кнопки «◀ Назад», когда игрок находится в корневом меню гардероба
# (например "dm open main_menu" или "menu"). Если пусто "" — работает back-fallback:
back-command: ""
# Что делать при нажатии «◀ Назад» на верхнем экране, если back-command пустой:
#   INVENTORY — открыть окно «Инвентарь и Экипировка» (инвентарь остаётся открытым!)
#   CLOSE     — закрыть меню полностью (кнопка CLOSE всегда закрывает полностью)
back-fallback: "INVENTORY"
inventory-title: "<#1e293b>Инвентарь и Экипировка"

# ==============================================================================
# РЕЖИМ 1: COMPACT — Компактные менюшки в 1 строчку для каждого слота брони
# ==============================================================================
compact_hub:
  title: "<#38bdf8>Гардероб <dark_gray>▪ <gray>Выберите слот"
  rows: 1
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  buttons:
    back:
      slots: [0]
      action: BACK
      material: ARROW
      name: "<#fbbf24>◀ Назад"
      lore:
        - "<gray>Вернуться назад / закрыть меню"
    head:
      slots: [1]
      action: OPEN_HEAD
      material: IRON_HELMET
      name: "<#f8fafc>Шлем и Голова"
      lore:
        - "<gray>Открыть 1-строчное меню шлема"
        - "<dark_gray>Маска 2D • Причёска 3D • Маска 3D • Статы • Косметика"
    chest:
      slots: [2]
      action: OPEN_CHEST
      material: IRON_CHESTPLATE
      name: "<#f8fafc>Нагрудник и Торс"
      lore:
        - "<gray>Открыть 1-строчное меню нагрудника"
        - "<dark_gray>Футболка • Куртка • Бронежилет • Косметика • Рюкзак"
    legs:
      slots: [3]
      action: OPEN_LEGS
      material: IRON_LEGGINGS
      name: "<#f8fafc>Поножи, Штаны и Пояс"
      lore:
        - "<gray>Открыть 1-строчное меню поножей"
        - "<dark_gray>Штаны 2D • Пояс 2D • Поножи Статы • Косметика • Пояс 3D"
    feet:
      slots: [4]
      action: OPEN_FEET
      material: IRON_BOOTS
      name: "<#f8fafc>Ботинки и Обувь"
      lore:
        - "<gray>Открыть 1-строчное меню обуви"
        - "<dark_gray>Носки • Ботинки 2D • Ботинки Статы • Косметика"
    refresh:
      slots: [6]
      action: REFRESH_SKIN
      material: LIME_DYE
      name: "<#4ade80>Обновить скин"
      lore:
        - "<gray>Пересобрать 2D-слои и 3D-броню"
    reset:
      slots: [7]
      action: RESET_SKIN
      material: RED_DYE
      name: "<#f87171>Сбросить слои скина"
      lore:
        - "<gray>Очистить слои от команд/скиллов"
    switch_mode:
      slots: [8]
      action: CYCLE_MODE
      material: COMPARATOR
      name: "<#facc15>Вид меню: <white><mode>"
      lore:
        - "<gray>Нажмите, чтобы переключить:"
        - "<dark_gray>Компактное (1 строчка) → С вкладками → Большое"

