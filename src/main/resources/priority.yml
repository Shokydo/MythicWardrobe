# ==============================================================================
# MythicWardrobe — Приоритет 2D-слоёв скина (ОТ ВЕРХНЕГО К НИЖНЕМУ)
# ==============================================================================
# Чем ВЫШЕ строка в списке `order`, тем ПОВЕРХ всех остальных слоёв рисуется слой!
# Можно писать как точный ID из layers.yml, так и короткий алиас:
#   mask -> mask_skin, brows -> eyebrows, body -> body_skin, boots -> boots_skin
#
# Пример порядка:
#   mask        <- самый верхний (рисуется поверх волос, бровей, глаз и тела)
#   hair
#   brows
#   eyes
#   body        <- самый нижний (базовый цвет кожи/тела)
#
# После редактирования выполните: /wardrobe reload
# ==============================================================================

order:
  - hat         # самый верхний слой (2D-шапка)
  - mask        # 2D-маска поверх всего лица
  - hair        # 2D-причёска
  - brows       # брови
  - eyes        # глаза
  - beard       # борода / усы
  - gloves      # перчатки
  - jacket      # верхняя одежда (куртка / кофта)
  - undershirt  # нижняя одежда (футболка / майка)
  - belt        # 2D-пояс / ремень / кушак (рисуется поверх штанов!)
  - boots_skin  # 2D-ботинки
  - pants       # штаны
  - socks       # носки
  - scars       # шрамы / татуировки
  - body        # самый нижний базовый слой кожи/тела (body_skin)
