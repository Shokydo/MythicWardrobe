# ==============================================================================
# MythicWardrobe — Конфигурация разделов и слотов экипировки
# ==============================================================================
# Типы слотов (kind):
#   SKIN_LAYER     — 2D-слой скина (PNG 64x64 из plugins/MythicWardrobe/overlays/)
#   ARMOR_REAL     — Реальная броня (синхронизируется с ванильным слотом брони -> статы, защита, MythicArmors, ~onEquip)
#   ARMOR_COSMETIC — Косметическая броня (подменяет визуал ванильного слота брони -> MythicArmors / ваниль без потери статов!)
#   DISPLAY_3D     — Одновременная 3D-модель (автоматически принимает ЛЮБУЮ 3D-броню/рюкзак/маску MythicArmors
#                    и рендерит её ПОВЕРХ основной брони через синхронизированный ArmorStand, а обычные 3D-предметы — через ItemDisplay!)
#   ARMOR_OVERLAY  — Дополнительный слой 3D-брони MythicArmors (можно добавлять сколько угодно слотов на голову/торс/ноги/пояс!)
#
# Приоритет слоёв скина (priority): чем больше число, тем ВЫШЕ (поверх других) рисуется слой.
# Зоны очистки 2-го слоя базового скина (clear-outer-regions):
#   HEAD_OUTER, BODY_OUTER, RIGHT_ARM_OUTER, LEFT_ARM_OUTER, RIGHT_LEG_OUTER, LEFT_LEG_OUTER, ALL_OUTER
# ==============================================================================

slots:
  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 1: ШЛЕМ / ГОЛОВА (открывается при клике на слот шлема)
  # ----------------------------------------------------------------------------
  mask_skin:
    section: HEAD
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 60
    folder: "masks"
    display-name: "<#a8dadc>Маска (Скин)"
    placeholder-material: WHITE_STAINED_GLASS_PANE
    lore:
      - "<gray>2D-слой маски/лица на скин"
      - "<dark_gray>Положите сюда предмет с тегом mask_skin"
    clear-outer-regions: []

  hair_3d:
    section: HEAD
    kind: ARMOR_OVERLAY
    equipment-slot: HEAD
    gui-slot: 11
    display-name: "<#f7aef8>Причёска (3D)"
    placeholder-material: MAGENTA_STAINED_GLASS_PANE
    lore:
      - "<gray>3D-причёска MythicArmors (поддерживает покраску!)"
      - "<dark_gray>Носится отдельно ИЛИ одновременно с маской и шлемом!"
    display:
      mount: HEAD
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: true
      hide-from-wearer: false
      transform: HEAD

  mask_3d:
    section: HEAD
    kind: DISPLAY_3D
    gui-slot: 12
    display-name: "<#f4a261>Маска / Шлем-слой (3D)"
    placeholder-material: ORANGE_STAINED_GLASS_PANE
    lore:
      - "<gray>Любая 3D-маска / шлем MythicArmors поверх основного шлема"
      - "<dark_gray>Можно носить одновременно 2+ 3D-модели на голове!"
    display:
      mount: HEAD
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: true
      hide-from-wearer: false
      transform: HEAD

  helmet_real:
    section: HEAD
    kind: ARMOR_REAL
    equipment-slot: HEAD
    gui-slot: 14
    display-name: "<#52b788>Шлем (Броня / Статы)"
    placeholder-material: IRON_HELMET
    lore:
      - "<gray>Реальный слот шлема (3D MythicArmors / Ваниль)"
      - "<green>Даёт защиту, чары и статы"

  helmet_cosmetic:
    section: HEAD
    kind: ARMOR_COSMETIC
    equipment-slot: HEAD
    gui-slot: 16
    display-name: "<#c77dff>Шлем (Косметика)"
    placeholder-material: LEATHER_HELMET
    lore:
      - "<gray>Перекрывает внешний вид шлема"
      - "<light_purple>Статы остаются от основного шлема"

  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 2: НАГРУДНИК / ТОРС (открывается при клике на слот нагрудника)
  # ----------------------------------------------------------------------------
  undershirt:
    section: CHEST
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 20
    folder: "undershirts"
    display-name: "<#90e0ef>Футболка / Майка (Скин)"
    placeholder-material: LIGHT_BLUE_STAINED_GLASS_PANE
    lore:
      - "<gray>Нижний 2D-слой одежды на торс"
      - "<dark_gray>Надевается под куртку/кофту"
    clear-outer-regions:
      - BODY_OUTER
      - RIGHT_ARM_OUTER
      - LEFT_ARM_OUTER

  jacket:
    section: CHEST
    kind: SKIN_LAYER
    gui-slot: 11
    priority: 30
    folder: "jackets"
    display-name: "<#48cae4>Куртка / Кофта (Скин)"
    placeholder-material: CYAN_STAINED_GLASS_PANE
    lore:
      - "<gray>Верхний 2D-слой одежды на торс"
      - "<dark_gray>Рисуется поверх футболки"
    clear-outer-regions:
      - BODY_OUTER
      - RIGHT_ARM_OUTER
      - LEFT_ARM_OUTER

  chest_real:
    section: CHEST
    kind: ARMOR_REAL
    equipment-slot: CHEST
    gui-slot: 13
    display-name: "<#52b788>Бронежилет (Броня / Статы)"
    placeholder-material: IRON_CHESTPLATE
    lore:
      - "<gray>Реальный слот нагрудника (3D MythicArmors / Ваниль)"
      - "<green>Даёт защиту, чары и статы"

  chest_cosmetic:
    section: CHEST
    kind: ARMOR_COSMETIC
    equipment-slot: CHEST
    gui-slot: 15
    display-name: "<#c77dff>Нагрудник (Косметика)"
    placeholder-material: LEATHER_CHESTPLATE
    lore:
      - "<gray>Перекрывает внешний вид бронежилета"
      - "<light_purple>Статы остаются от основного бронежилета"

  backpack_3d:
    section: CHEST
    kind: DISPLAY_3D
    gui-slot: 16
    display-name: "<#e9c46a>Рюкзак / Нагрудник-слой (3D)"
    placeholder-material: BROWN_STAINED_GLASS_PANE
    lore:
      - "<gray>Сюда можно положить 3D-рюкзак или ЛЮБОЙ 3D-нагрудник MythicArmors"
      - "<dark_gray>Отображается ОДНОВРЕМЕННО с основным бронежилетом!"
    display:
      mount: BACK
      offset-x: 0.0
      offset-y: 1.15
      offset-z: -0.26
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: false
      hide-from-wearer: false
      transform: HEAD

  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 3: ПОНОЖИ / НОГИ И ПОЯС (открывается при клике на слот поножей)
  # ----------------------------------------------------------------------------
  pants:
    section: LEGS
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 15
    folder: "pants"
    display-name: "<#4ea8de>Штаны (Скин)"
    placeholder-material: BLUE_STAINED_GLASS_PANE
    lore:
      - "<gray>Нижний 2D-слой штанов на скин"
    clear-outer-regions:
      - RIGHT_LEG_OUTER
      - LEFT_LEG_OUTER

  belt_skin:
    section: LEGS
    kind: SKIN_LAYER
    gui-slot: 11
    priority: 18
    folder: "belts"
    display-name: "<#f59e0b>Пояс / Ремень (Скин)"
    placeholder-material: YELLOW_STAINED_GLASS_PANE
    lore:
      - "<gray>2D-слой ремня, кушака или декоративного пояса"
      - "<dark_gray>Рисуется поверх штанов (overlays/belts/)"
    clear-outer-regions: []

  legs_real:
    section: LEGS
    kind: ARMOR_REAL
    equipment-slot: LEGS
    gui-slot: 13
    display-name: "<#52b788>Поножи (Броня / Статы)"
    placeholder-material: IRON_LEGGINGS
    lore:
      - "<gray>Реальный слот поножей (3D MythicArmors / Ваниль)"
      - "<green>Даёт защиту, чары и статы"

  legs_cosmetic:
    section: LEGS
    kind: ARMOR_COSMETIC
    equipment-slot: LEGS
    gui-slot: 15
    display-name: "<#c77dff>Поножи (Косметика)"
    placeholder-material: LEATHER_LEGGINGS
    lore:
      - "<gray>Перекрывает внешний вид поножей"
      - "<light_purple>Статы остаются от основных поножей"

  belt_3d:
    section: LEGS
    kind: ARMOR_OVERLAY
    equipment-slot: LEGS
    gui-slot: 16
    display-name: "<#fb923c>Пояс / Кобура / Декор (3D)"
    placeholder-material: ORANGE_STAINED_GLASS_PANE
    lore:
      - "<gray>3D-пояс, подсумки, кобура, цепи или зелья (MythicArmors)"
      - "<dark_gray>Носится отдельно ИЛИ одновременно с поножами!"
    display:
      mount: WAIST
      offset-x: 0.0
      offset-y: 0.72
      offset-z: 0.0
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: false
      hide-from-wearer: false
      transform: HEAD

  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 4: БОТИНКИ И ПОЯС (открывается при клике на слот ботинок)
  # ----------------------------------------------------------------------------
  socks:
    section: FEET
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 25
    folder: "socks"
    display-name: "<#ffd166>Носки (Скин)"
    placeholder-material: YELLOW_STAINED_GLASS_PANE
    lore:
      - "<gray>Нижний 2D-слой на ступни"
      - "<dark_gray>Надевается под ботинки"
    clear-outer-regions: []

  boots_skin:
    section: FEET
    kind: SKIN_LAYER
    gui-slot: 11
    priority: 35
    folder: "boots"
    display-name: "<#f4a261>Ботинки (Скин)"
    placeholder-material: ORANGE_STAINED_GLASS_PANE
    lore:
      - "<gray>Верхний 2D-слой обуви на скин"
      - "<dark_gray>Рисуется поверх носков"
    clear-outer-regions: []

  belt_real:
    section: FEET
    kind: ARMOR_REAL
    equipment-slot: FEET
    gui-slot: 14
    display-name: "<#52b788>Пояс (3D Броня / Статы)"
    placeholder-material: IRON_BOOTS
    lore:
      - "<gray>Реальный слот пояса / брони (MythicArmors / Ваниль)"
      - "<green>Занимает слот FEET — даёт защиту и статы"

  belt_cosmetic:
    section: FEET
    kind: ARMOR_COSMETIC
    equipment-slot: FEET
    gui-slot: 16
    display-name: "<#c77dff>Пояс (Косметика)"
    placeholder-material: LEATHER_BOOTS
    lore:
      - "<gray>Перекрывает внешний вид пояса/ботинок"
      - "<light_purple>Статы остаются от основного пояса"
