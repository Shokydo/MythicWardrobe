# ==============================================================================
# MythicWardrobe v1.11.0 — Конфигурация разделов и слотов экипировки (21 слот)
# ==============================================================================
# Каждый слот полностью отделён и независим (и в плагине, и в MythicWardrobe Studio):
#   HEAD  (6 слотов): hat, mask_skin, hair_3d, mask_3d, helmet_real, helmet_cosmetic
#   CHEST (6 слотов): undershirt, jacket, gloves, chest_real, chest_cosmetic, backpack_3d
#   LEGS  (5 слотов): pants, belt_skin, legs_real, legs_cosmetic, belt_3d
#   FEET  (4 слота):  socks, boots_skin, boots_real, boots_cosmetic
#
# Типы слотов (kind):
#   SKIN_LAYER     — 2D-слой скина (PNG 64x64 из plugins/MythicWardrobe/overlays/)
#   ARMOR_REAL     — Реальная 3D/ванильная броня (даёт защиту, чары, атрибуты и ~onEquip)
#   ARMOR_COSMETIC — Косметическая 3D-броня или мультимодальная краска (меняет визуал без потери статов)
#   DISPLAY_3D     — Самостоятельная 3D-модель поверх брони (маска, рюкзак и т.д.)
#   ARMOR_OVERLAY  — Дополнительный слой 3D-брони MythicArmors (3D-причёска, 3D-пояс и т.д.)
# ==============================================================================

slots:
  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 1: ШЛЕМ / ГОЛОВА (6 отдельных слотов)
  # ----------------------------------------------------------------------------
  hat:
    section: HEAD
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 70
    folder: "hats"
    display-name: "<#a8dadc>Шапка (2D Скин)"
    placeholder-material: WHITE_STAINED_GLASS_PANE
    lore:
      - "<gray>2D-слой шапки / головного убора на скин"
      - "<dark_gray>Положите сюда предмет со слотом hat"
    clear-outer-regions:
      - HEAD_OUTER

  mask_skin:
    section: HEAD
    kind: SKIN_LAYER
    gui-slot: 11
    priority: 60
    folder: "masks"
    display-name: "<#90e0ef>Маска (2D Скин)"
    placeholder-material: LIGHT_BLUE_STAINED_GLASS_PANE
    lore:
      - "<gray>2D-слой маски / банданы / лица на скин"
      - "<dark_gray>Положите сюда предмет со слотом mask_skin"
    clear-outer-regions: []

  hair_3d:
    section: HEAD
    kind: ARMOR_OVERLAY
    equipment-slot: HEAD
    gui-slot: 12
    display-name: "<#f7aef8>Причёска (3D)"
    placeholder-material: MAGENTA_STAINED_GLASS_PANE
    lore:
      - "<gray>3D-причёска MythicArmors (поддерживает покраску и hair-3d.yml)"
      - "<dark_gray>Носится отдельно ИЛИ одновременно с маской и шлемом!"
    display:
      mount: HEAD
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: true
      hide-from-wearer: false
      transform: HEAD

  mask_3d:
    section: HEAD
    kind: DISPLAY_3D
    gui-slot: 13
    display-name: "<#f4a261>Маска / Очки (3D)"
    placeholder-material: ORANGE_STAINED_GLASS_PANE
    lore:
      - "<gray>Самостоятельная 3D-маска / противогаз MythicArmors"
      - "<dark_gray>Носится отдельно ИЛИ поверх основного шлема!"
    display:
      mount: HEAD
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: true
      hide-from-wearer: false
      transform: HEAD

  helmet_real:
    section: HEAD
    kind: ARMOR_REAL
    equipment-slot: HEAD
    gui-slot: 15
    display-name: "<#52b788>Шлем (3D Броня / Статы)"
    placeholder-material: IRON_HELMET
    lore:
      - "<gray>Реальный слот шлема (3D MythicArmors / Ваниль)"
      - "<green>Даёт защиту, чары, атрибуты и статы"

  helmet_cosmetic:
    section: HEAD
    kind: ARMOR_COSMETIC
    equipment-slot: HEAD
    gui-slot: 16
    display-name: "<#c77dff>Шлем (3D Косметика)"
    placeholder-material: LEATHER_HELMET
    lore:
      - "<gray>Косметическая 3D-модель или скин шлема"
      - "<light_purple>Статы остаются от реального шлема"

  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 2: НАГРУДНИК / ТОРС (6 отдельных слотов)
  # ----------------------------------------------------------------------------
  undershirt:
    section: CHEST
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 20
    folder: "undershirts"
    display-name: "<#90e0ef>Футболка / Майка (2D Скин)"
    placeholder-material: LIGHT_BLUE_STAINED_GLASS_PANE
    lore:
      - "<gray>Нижний 2D-слой одежды на торс"
      - "<dark_gray>Надевается под куртку / кофту"
    clear-outer-regions:
      - BODY_OUTER
      - RIGHT_ARM_OUTER
      - LEFT_ARM_OUTER

  jacket:
    section: CHEST
    kind: SKIN_LAYER
    gui-slot: 11
    priority: 30
    folder: "jackets"
    display-name: "<#48cae4>Куртка / Костюм (2D Скин)"
    placeholder-material: CYAN_STAINED_GLASS_PANE
    lore:
      - "<gray>Верхний 2D-слой одежды на торс (куртка / химзащита)"
      - "<dark_gray>Рисуется поверх футболки"
    clear-outer-regions:
      - BODY_OUTER
      - RIGHT_ARM_OUTER
      - LEFT_ARM_OUTER

  gloves:
    section: CHEST
    kind: SKIN_LAYER
    gui-slot: 12
    priority: 40
    folder: "gloves"
    display-name: "<#38bdf8>Перчатки (2D Скин)"
    placeholder-material: BLUE_STAINED_GLASS_PANE
    lore:
      - "<gray>2D-слой перчаток на кисти рук"
      - "<dark_gray>Положите сюда предмет со слотом gloves"
    clear-outer-regions: []

  chest_real:
    section: CHEST
    kind: ARMOR_REAL
    equipment-slot: CHEST
    gui-slot: 14
    display-name: "<#52b788>Нагрудник (3D Броня / Статы)"
    placeholder-material: IRON_CHESTPLATE
    lore:
      - "<gray>Реальный слот нагрудника / бронежилета (3D MythicArmors / Ваниль)"
      - "<green>Даёт защиту, чары, атрибуты и статы"

  chest_cosmetic:
    section: CHEST
    kind: ARMOR_COSMETIC
    equipment-slot: CHEST
    gui-slot: 15
    display-name: "<#c77dff>Нагрудник (3D Косметика)"
    placeholder-material: LEATHER_CHESTPLATE
    lore:
      - "<gray>Косметический нагрудник или мультимодальная краска (WhiteVestPaint)"
      - "<light_purple>Статы остаются от реального нагрудника"

  backpack_3d:
    section: CHEST
    kind: DISPLAY_3D
    gui-slot: 16
    display-name: "<#e9c46a>Рюкзак / Плащ (3D)"
    placeholder-material: BROWN_STAINED_GLASS_PANE
    lore:
      - "<gray>Самостоятельный 3D-рюкзак / плащ MythicArmors"
      - "<dark_gray>Отображается отдельно ИЛИ поверх нагрудника!"
    display:
      mount: BACK
      offset-x: 0.0
      offset-y: 1.15
      offset-z: -0.26
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: false
      hide-from-wearer: false
      transform: HEAD

  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 3: ПОНОЖИ / НОГИ И ПОЯС (5 отдельных слотов)
  # ----------------------------------------------------------------------------
  pants:
    section: LEGS
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 15
    folder: "pants"
    display-name: "<#4ea8de>Штаны (2D Скин)"
    placeholder-material: BLUE_STAINED_GLASS_PANE
    lore:
      - "<gray>Нижний 2D-слой штанов на скин"
    clear-outer-regions:
      - RIGHT_LEG_OUTER
      - LEFT_LEG_OUTER

  belt_skin:
    section: LEGS
    kind: SKIN_LAYER
    gui-slot: 11
    priority: 18
    folder: "belts"
    display-name: "<#f59e0b>Пояс / Ремень (2D Скин)"
    placeholder-material: YELLOW_STAINED_GLASS_PANE
    lore:
      - "<gray>2D-слой ремня, кушака или декоративного пояса"
      - "<dark_gray>Рисуется поверх штанов (overlays/belts/)"
    clear-outer-regions: []

  legs_real:
    section: LEGS
    kind: ARMOR_REAL
    equipment-slot: LEGS
    gui-slot: 13
    display-name: "<#52b788>Поножи (3D Броня / Статы)"
    placeholder-material: IRON_LEGGINGS
    lore:
      - "<gray>Реальный слот поножей (3D MythicArmors / Ваниль)"
      - "<green>Даёт защиту, чары, атрибуты и статы"

  legs_cosmetic:
    section: LEGS
    kind: ARMOR_COSMETIC
    equipment-slot: LEGS
    gui-slot: 14
    display-name: "<#c77dff>Поножи (3D Косметика)"
    placeholder-material: LEATHER_LEGGINGS
    lore:
      - "<gray>Косметическая 3D-модель или скин поножей"
      - "<light_purple>Статы остаются от реальных поножей"

  belt_3d:
    section: LEGS
    kind: ARMOR_OVERLAY
    equipment-slot: LEGS
    gui-slot: 16
    display-name: "<#fb923c>Пояс / Кобура / Декор (3D)"
    placeholder-material: ORANGE_STAINED_GLASS_PANE
    lore:
      - "<gray>3D-пояс, подсумки, кобура, цепи или зелья (MythicArmors)"
      - "<dark_gray>Носится отдельно ИЛИ одновременно с поножами!"
    display:
      mount: WAIST
      offset-x: 0.0
      offset-y: 0.72
      offset-z: 0.0
      scale-x: 1.0
      scale-y: 1.0
      scale-z: 1.0
      pitch-follow: false
      hide-from-wearer: false
      transform: HEAD

  # ----------------------------------------------------------------------------
  # РАЗДЕЛ 4: БОТИНКИ И ОБУВЬ (4 отдельных слота)
  # ----------------------------------------------------------------------------
  socks:
    section: FEET
    kind: SKIN_LAYER
    gui-slot: 10
    priority: 25
    folder: "socks"
    display-name: "<#ffd166>Носки (2D Скин)"
    placeholder-material: YELLOW_STAINED_GLASS_PANE
    lore:
      - "<gray>Нижний 2D-слой на ступни"
      - "<dark_gray>Надевается под ботинки"
    clear-outer-regions: []

  boots_skin:
    section: FEET
    kind: SKIN_LAYER
    gui-slot: 11
    priority: 35
    folder: "boots"
    display-name: "<#f4a261>Ботинки (2D Скин)"
    placeholder-material: ORANGE_STAINED_GLASS_PANE
    lore:
      - "<gray>Верхний 2D-слой обуви на скин"
      - "<dark_gray>Рисуется поверх носков"
    clear-outer-regions: []

  boots_real:
    section: FEET
    kind: ARMOR_REAL
    equipment-slot: FEET
    gui-slot: 14
    display-name: "<#52b788>Ботинки (3D Броня / Статы)"
    placeholder-material: IRON_BOOTS
    lore:
      - "<gray>Реальный слот ботинок (3D MythicArmors / Ваниль)"
      - "<green>Даёт защиту, чары, атрибуты и статы"

  boots_cosmetic:
    section: FEET
    kind: ARMOR_COSMETIC
    equipment-slot: FEET
    gui-slot: 15
    display-name: "<#c77dff>Ботинки (3D Косметика)"
    placeholder-material: LEATHER_BOOTS
    lore:
      - "<gray>Косметическая 3D-модель или скин ботинок"
      - "<light_purple>Статы остаются от реальных ботинок"
