    Chest:
      Armor: 4
      ArmorToughness: 1
  Equippable:
    Model: mythicarmor:tactical_backpack_chest_piece
    Slot: CHEST
    EquipSound: 'item.armor.equip_leather'
  Options:
    ItemModel: mythicarmor:tactical_backpack_chest_piece
